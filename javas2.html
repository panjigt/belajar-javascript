<!DOCTYPE html>
<html>
<head>
<title>Ubah Warna</title>
<style>
body {
    font-family: Arial;
    text-align: center;
    padding: 50px;
}
button {
    padding: 10px;
    margin: 5px;
}
</style>
</head>
<body>
    <h1>Ubah Warna Background</h1>
    <button onclick="ubahWarna()">Ubah Warna</button>
<script>
    function ubahWarna() {
    document.body.style.backgroundColor = "lightblue";
}
</script>
</body>
</html>
